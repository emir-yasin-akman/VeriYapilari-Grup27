<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faz 3 - Property Graph Görselleştirme (Dinamik Boyutlu)</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: #f4f7f6; }
        #network-container { flex: 3; border-right: 2px solid #ddd; background-color: #ffffff; height: 100vh; }
        #side-panel { flex: 1; padding: 20px; background-color: #2c3e50; color: #ecf0f1; box-shadow: -2px 0 5px rgba(0,0,0,0.1); overflow-y: auto; }
        h2 { margin-top: 20px; border-bottom: 2px solid #34495e; padding-bottom: 10px; font-size: 1.2em; }
        h2:first-of-type { margin-top: 0; }
        .property { margin-bottom: 15px; }
        .property-title { font-weight: bold; color: #3498db; }
        .property-value { margin-top: 5px; font-size: 1.1em; }
        .connection-list { margin-top: 10px; padding-left: 15px; font-size: 0.95em; }
        .connection-list li { margin-bottom: 8px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; background-color: #7f8c8d; color: white; margin-left: 5px; }
        .rel-friend { background-color: #3498db; } .rel-attends { background-color: #2ecc71; } .rel-photo { background-color: #e67e22; } .rel-likes { background-color: #e74c3c; }
        
        #search-container { margin-bottom: 20px; display: flex; gap: 10px; }
        #search-box { flex: 1; padding: 8px; border: none; border-radius: 4px; outline: none; font-size: 1em;}
        #search-btn { padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #search-btn:hover { background-color: #2980b9; }

        .filter-group { display: flex; flex-direction: column; gap: 10px; background: #34495e; padding: 12px; border-radius: 5px; margin-bottom: 15px; }
        .filter-item { display: flex; align-items: center; gap: 10px; font-size: 0.95em; cursor: pointer; }
        .filter-item input { cursor: pointer; width: 16px; height: 16px; }

        #info-box { background-color: #34495e; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 0.9em; color: #bdc3c7; }
    </style>
</head>
<body>

    <div id="network-container"></div>

    <div id="side-panel">
        <h2>Arama Modülü</h2>
        <div id="search-container">
            <input type="text" id="search-box" placeholder="İsim veya ID ara (Örn: Ali)...">
            <button id="search-btn" onclick="searchNode()">Bul</button>
        </div>

        <h2>Katman Filtreleri</h2>
        <div class="filter-group">
            <label class="filter-item"><input type="checkbox" id="chk-user" checked onchange="filterGraph()"> 🔵 Kullanıcıları Göster (User)</label>
            <label class="filter-item"><input type="checkbox" id="chk-event" checked onchange="filterGraph()"> 🟢 Etkinlikleri Göster (Event)</label>
            <label class="filter-item"><input type="checkbox" id="chk-photo" checked onchange="filterGraph()"> 🟠 Fotoğrafları Göster (Photo)</label>
        </div>

        <h2>Düğüm Özellikleri</h2>
        <div id="node-details">
            <p>Detaylarını görmek için graf üzerinden bir düğüme tıklayın.</p>
        </div>
        
        <div id="info-box">
            <strong>Bağlantı Durumu:</strong> <span id="status">API'ye bağlanılıyor...</span><br><br>
            <strong>İlişki Kuralları:</strong>
            <ul style="padding-left: 20px; margin-top: 5px; line-height: 1.4em;">
                <li><b style="color:#3498db">—</b> FRIEND (Yönsüz Çizgi)</li>
                <li><b style="color:#2ecc71">→</b> ATTENDS (Yönlü Ok)</li>
                <li><b style="color:#e67e22">→</b> HAS_PHOTO (Yönlü Ok)</li>
                <li><b style="color:#e74c3c">→</b> LIKES (Yönlü Ok)</li>
            </ul>
        </div>
    </div>

    <script>
        let network = null;
        let nodes = null;
        let edges = null;
        let originalNodes = [];
        let originalEdges = [];

        async function loadGraphData() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/graph');
                if (!response.ok) throw new Error("API'ye ulaşılamadı");
                const data = await response.json();
                if (data.error) { document.getElementById('status').innerHTML = `<span style="color:#e74c3c">${data.error}</span>`; return; }

                // YENİ ÖZELLİK: Düğümlerin bağlantı sayısını (Degree Centrality) hesaplama
                let nodeConnectionCounts = {};
                data.edges.forEach(edge => {
                    nodeConnectionCounts[edge.from] = (nodeConnectionCounts[edge.from] || 0) + 1;
                    nodeConnectionCounts[edge.to] = (nodeConnectionCounts[edge.to] || 0) + 1;
                });

                originalNodes = data.nodes.map(node => {
                    let shape = 'dot', color = '#97C2FC';
                    if (node.group === 'User') { shape = 'dot'; color = '#3498db'; } 
                    else if (node.group === 'Photo') { shape = 'square'; color = '#e67e22'; } 
                    else if (node.group === 'Event') { shape = 'star'; color = '#2ecc71'; }
                    
                    // Bağlantı sayısını düğümün 'value' özelliğine atayarak otomatik ölçeklenmesini sağlıyoruz
                    let connectionCount = nodeConnectionCounts[node.id] || 1;

                    return { 
                        ...node, 
                        shape: shape, 
                        value: connectionCount, // Vis.js bu değeri okuyup düğümü büyütecek
                        color: { background: color, border: '#2c3e50' },
                        title: `${node.label} (${connectionCount} bağlantı)` // Üzerine gelince bağlantı sayısını gösterir
                    };
                });

                originalEdges = data.edges.map(edge => {
                    let edgeColor = '#95a5a6';
                    let customOptions = {};

                    if (edge.label === 'FRIEND') { 
                        edgeColor = '#3498db'; 
                        // YÖNSÜZLÜK KESİN ÇÖZÜMÜ: Global okları bu ilişki için açıkça kapatıyoruz
                        customOptions.arrows = { to: { enabled: false } }; 
                    } 
                    else if (edge.label === 'LIKES') { edgeColor = '#e74c3c'; } 
                    else if (edge.label === 'ATTENDS') { edgeColor = '#2ecc71'; }
                    else if (edge.label === 'HAS_PHOTO') { edgeColor = '#e67e22'; }
                    
                    return { ...edge, ...customOptions, color: { color: edgeColor, highlight: '#34495e' } };
                });

                nodes = new vis.DataSet(originalNodes);
                edges = new vis.DataSet(originalEdges);
                const container = document.getElementById('network-container');
                
                const options = {
                    nodes: { 
                        font: { size: 14, color: '#333' }, 
                        borderWidth: 2,
                        // Düğüm büyüme sınırları (En az 10, çok bağlantısı olanlar 40'a kadar büyür)
                        scaling: { min: 10, max: 40 } 
                    },
                    edges: { 
                        arrows: { to: { enabled: true, scaleFactor: 0.5 } }, // Varsayılan oklar
                        font: { size: 11, align: 'middle' }, 
                        color: { inherit: 'from' }, 
                        smooth: { type: 'continuous' } 
                    },
                    physics: { 
                        enabled: true,
                        barnesHut: { 
                            gravitationalConstant: -20000, 
                            centralGravity: 0.1, 
                            springLength: 200, 
                            springConstant: 0.04,
                            damping: 0.09,
                            avoidOverlap: 1 
                        },
                        stabilization: { 
                            iterations: 1000, 
                            updateInterval: 100
                        }
                    },
                    layout: { improvedLayout: true, hierarchical: false },
                    interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true }
                };

                network = new vis.Network(container, { nodes: nodes, edges: edges }, options);
                document.getElementById('status').innerHTML = `<span style="color:#2ecc71">Veri başarıyla yüklendi! (${data.nodes.length} Düğüm)</span>`;

                network.on("selectNode", function (params) {
                    const nodeId = params.nodes[0];
                    const nodeData = nodes.get(nodeId);
                    const connectedEdgeIds = network.getConnectedEdges(nodeId);
                    let connectionsHtml = '<ul class="connection-list">';
                    
                    if (connectedEdgeIds.length === 0) {
                        connectionsHtml += '<li>Bu düğümün hiçbir bağlantısı yok.</li>';
                    } else {
                        connectedEdgeIds.forEach(edgeId => {
                            const edge = edges.get(edgeId);
                            if(!edge) return;
                            const isSource = (edge.from === nodeId);
                            const otherNodeId = isSource ? edge.to : edge.from;
                            const otherNode = nodes.get(otherNodeId);
                            if (otherNode) {
                                // Yan panelde FRIEND ilişkisini yönsüz (—) göster
                                const direction = edge.label === 'FRIEND' ? '—' : (isSource ? '→' : '←');
                                
                                let badgeClass = 'badge ';
                                if (edge.label === 'FRIEND') badgeClass += 'rel-friend';
                                else if (edge.label === 'ATTENDS') badgeClass += 'rel-attends';
                                else if (edge.label === 'HAS_PHOTO') badgeClass += 'rel-photo';
                                else if (edge.label === 'LIKES') badgeClass += 'rel-likes';
                                
                                connectionsHtml += `<li>${direction} <b>${otherNode.label}</b> <span class="${badgeClass}">${edge.label}</span></li>`;
                            }
                        });
                    }
                    connectionsHtml += '</ul>';

                    document.getElementById('node-details').innerHTML = `
                        <div class="property"><div class="property-title">ID Numarası</div><div class="property-value">#${nodeData.id}</div></div>
                        <div class="property"><div class="property-title">Düğüm Türü (Type)</div><div class="property-value">${nodeData.group}</div></div>
                        <div class="property"><div class="property-title">İsim / Başlık (Name)</div><div class="property-value">${nodeData.label}</div></div>
                        <div class="property"><div class="property-title">Toplam Bağlantı (Derece)</div><div class="property-value">${nodeData.value}</div></div>
                        <div class="property"><div class="property-title">Mevcut Bağlantıları</div><div class="property-value">${connectionsHtml}</div></div>
                    `;
                });

                network.on("deselectNode", function () {
                    document.getElementById('node-details').innerHTML = "<p>Detaylarını görmek için graf üzerinden bir düğüme tıklayın.</p>";
                });

                document.getElementById("search-box").addEventListener("keypress", function(event) {
                    if (event.key === "Enter") searchNode();
                });

            } catch (error) {
                document.getElementById('status').innerHTML = `<span style="color:#e74c3c">Bağlantı Hatası: API sunucusu çalışmıyor.</span>`;
            }
        }

        function filterGraph() {
            if (!nodes || !edges) return;
            const showUser = document.getElementById('chk-user').checked;
            const showEvent = document.getElementById('chk-event').checked;
            const showPhoto = document.getElementById('chk-photo').checked;

            const filteredNodes = originalNodes.filter(node => {
                if (node.group === 'User' && !showUser) return false;
                if (node.group === 'Event' && !showEvent) return false;
                if (node.group === 'Photo' && !showPhoto) return false;
                return true;
            });

            const activeNodeIds = filteredNodes.map(n => n.id);
            const filteredEdges = originalEdges.filter(edge => {
                return activeNodeIds.includes(edge.from) && activeNodeIds.includes(edge.to);
            });

            nodes.clear();
            nodes.add(filteredNodes);
            edges.clear();
            edges.add(filteredEdges);
        }

        function searchNode() {
            if (!nodes) return;
            const term = document.getElementById('search-box').value.toLowerCase().trim();
            if (!term) return;
            const allNodes = nodes.get();
            const foundNode = allNodes.find(n => n.label.toLowerCase().includes(term) || n.id.toString() === term);
            if (foundNode) {
                network.selectNodes([foundNode.id]);
                network.focus(foundNode.id, { scale: 1.3, animation: { duration: 800 } });
                network.emit("selectNode", { nodes: [foundNode.id] });
            } else {
                alert("Görünür düğümler arasında eşleşme bulunamadı.");
            }
        }

        window.onload = loadGraphData;
    </script>
</body>
</html>
